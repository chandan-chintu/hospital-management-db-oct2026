spring.application.name=hospital-management-db

server.port=7799

# ==========================================
# MySQL Database Connection Settings
# ==========================================
# 1. Database URL
spring.datasource.url=jdbc:mysql://localhost:3306/hospital_db_oct2026

# 2. Database Credentials
spring.datasource.username=root
spring.datasource.password=root1234

# 3. MySQL Driver (Optional in modern Spring Boot versions, as it auto-detects it)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / Hibernate Configurations (Optional)
# ==========================================
# DDL Auto: Options include update, create, create-drop, validate, or none
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in the console (useful for debugging)
spring.jpa.show-sql=true

